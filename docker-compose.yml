services:
  mysql:
    image: mysql:8.4
    container_name: eistein-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-eistein}
      MYSQL_USER: ${DB_USERNAME:-eistein}
      MYSQL_PASSWORD: ${DB_PASSWORD:-eistein}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    container_name: eistein-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-eistein}
      DB_USERNAME: ${DB_USERNAME:-eistein}
      DB_PASSWORD: ${DB_PASSWORD:-eistein}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  mysql-data:
